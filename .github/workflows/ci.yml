name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Corepack is enabled after setup-node so the shims belong to the Node
      # version this job actually runs; the pnpm version comes from the
      # packageManager field in package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Proves the architectural rules still reject what they must.
      # No coverage threshold yet: CLAUDE.md §7 activates it in Phase 3.
      - name: Architectural guards
        run: pnpm test:arch

      - name: Build
        run: pnpm build

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only Chromium: the supported matrix is Chrome on Android.
      - name: Install Chromium for Playwright
        run: pnpm --filter @agrotwin/app exec playwright install --with-deps chromium

      # Builds first, then serves the build: the service worker only exists in
      # a production build, so this is what makes the offline test meaningful.
      - name: Vertical slice end to end
        run: pnpm test:e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 7
